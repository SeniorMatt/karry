name: ci
on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to build
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust cmake ninja qt6-base ki18n kcoreaddons kwidgetsaddons
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: cargo test --workspace
      - run: cargo build --release -p karry-cli
      - run: cmake -B build -G Ninja && cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: karry
          path: |
            build/app/karry
            target/release/karry-cli
