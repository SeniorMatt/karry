[package]
name = "karry-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
thiserror = "1"
tar = { version = "0.4", default-features = false }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
tar = "0.4"
flate2 = "1"
