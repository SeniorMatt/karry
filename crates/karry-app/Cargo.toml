[package]
name = "karry-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "karry"
path = "src/main.rs"

[dependencies]
karry-core = { path = "../karry-core" }
serde = "1"
serde_json = "1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = "0.10"
